  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
  /* GRF Evolution Basics: brand tokens and component styles */

<script>
  // Kurztexte sind redaktionelle Vorschläge; ohne geprüfte Einzelzielseiten verlinken alle auf die Regionenübersicht.
  const regions = [
    { mapIndex: 3, name: "Chur", description: "In der Bündner Hauptstadt treffen historische Gassen und Kultur auf kurze Wege hinaus in die Bergwelt.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/chur-rheintal" },
    { mapIndex: 9, name: "Heidiland", description: "Zwischen Weinbergen, Seen und Bergen bietet Heidiland abwechslungsreiche Entdeckungen in einer vielseitigen Landschaft.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/heidiland" },
    { mapIndex: 10, name: "Prättigau", description: "Das Prättigau verbindet ruhige Dörfer mit eindrücklichen Bergkulissen und aussichtsreichen Höhenwegen.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/praettigau" },
    { mapIndex: 4, name: "Davos Klosters", description: "Weite Berglandschaften und ein vielseitiges Angebot machen Davos Klosters zum Erlebnisraum für Sommer und Winter.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/davos-klosters" },
    { mapIndex: 0, name: "Arosa Lenzerheide", description: "Zwischen Bergseen und Gipfeln verbindet die Region alpine Natur mit vielfältigen Erlebnissen zu jeder Jahreszeit.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/arosa-lenzerheide" },
    { mapIndex: 1, name: "Bergün Filisur", description: "Historische Dörfer, eindrückliche Bahnlandschaften und aussichtsreiche Wege prägen diese alpine Ferienregion.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/berguen-filisur" },
    { mapIndex: 13, name: "Val Surses Savognin Bivio", description: "Rund um Savognin und Bivio trifft weite Berglandschaft auf rauen Charme und vielfältige Naturerlebnisse.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/val-surses-savognin-bivio" },
    { mapIndex: 15, name: "Viamala", description: "Tiefe Schluchten, historische Wege und Dörfer machen die Region Viamala zu einem eindrücklichen Ausgangspunkt für Entdeckungen.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/viamala" },
    { mapIndex: 8, name: "Flims Laax Falera", description: "Rheinschlucht, Bergseen und vielfältige Outdoor-Erlebnisse prägen die Region rund um Flims, Laax und Falera.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/flims-laax-falera" },
    { mapIndex: 12, name: "Surselva", description: "Weite Täler, romanische Kultur und ursprüngliche Berglandschaften laden zum Wandern und Entdecken ein.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/surselva" },
    { mapIndex: 5, name: "Disentis Sedrun", description: "Rund um die Rheinquelle laden weite Täler und alpine Wege dazu ein, die Bergwelt zu entdecken.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/disentis-sedrun" },
    { mapIndex: 16, name: "Vals", description: "Das abgelegene Bergtal begeistert mit seiner eindrücklichen Gebirgslandschaft, dem Dorf Vals und stillen Naturerlebnissen.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/vals" },
    { mapIndex: 11, name: "San Bernardino Mesolcina Calanca", description: "Südliche Täler, Passlandschaften und stille Bergdörfer machen diese Region zu einem besonderen Teil Graubündens.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/san-bernardino-mesolcina-calanca" },
    { mapIndex: 2, name: "Bregaglia Maloja", description: "Südalpine Täler, markante Granitberge und eine eigenständige Kultur geben dem Bergell seinen besonderen Charakter.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/bregaglia-engadin" },
    { mapIndex: 14, name: "Valposchiavo", description: "Im südlichen Tal treffen alpine Landschaften, italienischsprachige Kultur und besondere Bahn-Erlebnisse aufeinander.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/valposchiavo" },
    { mapIndex: 7, name: "Engadin St. Moritz", description: "Seen, klare Bergluft und weite Hochgebirgslandschaften verbinden sich mit Kultur und alpinem Lebensgefühl.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/engadin-st-moritz" },
    { mapIndex: 6, name: "Engadin Samnaun Val Müstair", description: "Drei Täler, drei Charaktere: Kultur im Unterengadin, Ruhe im Val Müstair und Weite in Samnaun.", url: "https://www.graubuenden.ch/de/graubuenden/regionen/engadin-samnaun-val-muestair" }
  ];
  const overviewUrl = "https://www.graubuenden.ch/de/graubuenden/regionen";
  const regionPaths = Array.from(document.querySelectorAll(".actual-region"));
  const markers = Array.from(document.querySelectorAll(".actual-marker"));
  // Exclude the Vals perimeter from Surselva's selected fill so the destinations stay distinct.
  (() => {
    const map = document.querySelector(".actual-map");
    const defs = map && map.querySelector("defs");
    const surselva = map && map.querySelector('.actual-region[data-index="12"]');
    const vals = map && map.querySelector('.actual-region[data-index="16"]');
    if (!defs || !surselva || !vals) return;
    const svgNS = "http://www.w3.org/2000/svg";
    const mask = document.createElementNS(svgNS, "mask");
    mask.setAttribute("id", "surselva-excludes-vals");
    mask.setAttribute("maskUnits", "userSpaceOnUse");
    mask.setAttribute("maskContentUnits", "userSpaceOnUse");
    mask.setAttribute("x", "0");
    mask.setAttribute("y", "0");
    mask.setAttribute("width", "760");
    mask.setAttribute("height", "545");
    const base = document.createElementNS(svgNS, "rect");
    base.setAttribute("x", "0");
    base.setAttribute("y", "0");
    base.setAttribute("width", "760");
    base.setAttribute("height", "545");
    base.setAttribute("fill", "#fff");
    const valsCutout = document.createElementNS(svgNS, "path");
    valsCutout.setAttribute("d", vals.getAttribute("d"));
    valsCutout.setAttribute("fill", "#000");
    valsCutout.setAttribute("fill-rule", "evenodd");
    mask.append(base, valsCutout);
    defs.appendChild(mask);
    surselva.setAttribute("mask", "url(#surselva-excludes-vals)");
  })();
  // Mobile: Marker-Nummern als Touch-Ziele vorbereiten (grössere, unsichtbare Trefferfläche + skalierbarer Innenteil).
  (() => {
    const svgNS = "http://www.w3.org/2000/svg";
    markers.forEach(marker => {
      const inner = document.createElementNS(svgNS, "g");
      inner.setAttribute("class", "marker-inner");
      while (marker.firstChild) inner.appendChild(marker.firstChild);
      const hit = document.createElementNS(svgNS, "circle");
      hit.setAttribute("class", "marker-hit");
      hit.setAttribute("r", "30");
      marker.append(hit, inner);
    });
  })();
  const title = document.getElementById("region-title");
  const description = document.getElementById("region-description");
  const counter = document.getElementById("region-count");
  const meta = document.getElementById("region-meta");
  const progressBar = document.getElementById("region-progress-bar");
  const link = document.getElementById("region-link");
  const stepButtons = Array.from(document.querySelectorAll("[data-region-step]"));
  let activeRegionIndex = 0;
  function chooseRegion(index) {
    const safeIndex = (index + regions.length) % regions.length;
    const region = regions[safeIndex];
    activeRegionIndex = safeIndex;
    title.textContent = region.name;
    description.textContent = region.description;
    counter.textContent = String(safeIndex + 1);
    counter.setAttribute("aria-label", "Destination " + String(safeIndex + 1) + " von " + String(regions.length));
    if (meta) meta.textContent = "Region " + String(safeIndex + 1) + " von " + String(regions.length);
    if (progressBar) progressBar.style.width = ((safeIndex + 1) / regions.length * 100).toFixed(2) + "%";
    link.href = region.url || overviewUrl;
    regionPaths.forEach(path => {
      const active = Number(path.dataset.index) === region.mapIndex;
      path.classList.toggle("is-active", active);
      path.setAttribute("aria-pressed", active ? "true" : "false");
    });
    markers.forEach(marker => marker.classList.toggle("is-active", Number(marker.dataset.marker) === region.mapIndex));
  }

  stepButtons.forEach(button => {
    const step = Number(button.dataset.regionStep) || 0;
    button.addEventListener("click", () => chooseRegion(activeRegionIndex + step));
  });

  regionPaths.forEach(path => {
    const regionIndex = regions.findIndex(region => region.mapIndex === Number(path.dataset.index));
    if (regionIndex < 0) return;
    // Hover-Auswahl nur mit Maus; auf Touch würde sonst schon das Scrollen über die Karte die Region wechseln.
    path.addEventListener("pointerenter", event => { if (event.pointerType !== "touch") chooseRegion(regionIndex); });
    path.addEventListener("focus", () => chooseRegion(regionIndex));
    path.addEventListener("click", () => chooseRegion(regionIndex));
    path.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        chooseRegion(regionIndex);
      }
    });
  });

  markers.forEach(marker => {
    const regionIndex = regions.findIndex(region => region.mapIndex === Number(marker.dataset.marker));
    if (regionIndex < 0) return;
    marker.addEventListener("click", () => chooseRegion(regionIndex));
  });
  // Nummern auf der Karte entsprechen der Reihenfolge im Slider (1 = Chur, 2 = Heidiland, ...).
  markers.forEach(marker => {
    const regionIndex = regions.findIndex(region => region.mapIndex === Number(marker.dataset.marker));
    const text = marker.querySelector("text");
    if (text && regionIndex >= 0) text.textContent = String(regionIndex + 1);
  });
  chooseRegion(0);

  // Intrinsic-height sender for a cross-origin wrapper/CMS iframe chain.
  // Height is measured from content, never from 100vh; identical values are not resent.
  (() => {
    if (window.parent === window) return;
    let lastHeight = 0;
    let scheduled = false;
    const measure = () => {
      scheduled = false;
      const root = document.documentElement;
      const body = document.body;
      const height = Math.ceil(Math.max(root.scrollHeight, root.offsetHeight, body.scrollHeight, body.offsetHeight));
      if (height > 0 && Math.abs(height - lastHeight) >= 2) {
        lastHeight = height;
        window.parent.postMessage({ height }, "*");
      }
    };
    const schedule = () => {
      if (scheduled) return;
      scheduled = true;
      window.requestAnimationFrame(measure);
    };
    if ("ResizeObserver" in window) {
      const observer = new ResizeObserver(schedule);
      observer.observe(document.documentElement);
      observer.observe(document.body);
    }
    if ("MutationObserver" in window) {
      const mutations = new MutationObserver(schedule);
      mutations.observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true });
    }
    window.addEventListener("load", schedule, { once: true });
    window.addEventListener("resize", schedule, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", schedule, { passive: true });
    schedule();
    window.setTimeout(schedule, 250);
    window.setTimeout(schedule, 1000);
  })();
</script>
</body>
</html>
